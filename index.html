<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Cube Dash</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0d1a; overflow: hidden; touch-action: none; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; max-width: 100vw; max-height: 100vh; touch-action: none; background: #000; }
</style>
</head>
<body>
<canvas id="c" width="960" height="540"></canvas>
<script>
"use strict";
const cv = document.getElementById("c");
const ctx = cv.getContext("2d");
let W = 960, H = 540, OY = 0, PSX = 240, HUD = 0;   // 화면 크기는 가로/세로 모드에 따라 layout()에서 바뀜
const T = 48, GROUND = 440;   // 타일(장애물) 한 칸 크기: 40 → 48로 키움
const K = T / 40;             // 타일 크기 배율: 점프·속도 등 물리값을 같이 늘려 칸 기준 난이도는 유지
const ZOOM = 0.9;             // 게임 화면 배율 (살짝 축소해 앞을 더 멀리 보이게)

// ---------- 물리 상수 ----------
const BASE_SPEED = 596 * K;     // px/s (스테이지별 배율 적용, 기존 426의 1.4배)
const GRAV = 2600 * K;
const JUMP_V = 720 * K;
const PAD_V = 1200 * K;
const S = 30;               // 플레이어 히트박스
const FLY_TOP = GROUND - 8 * T;
const AIR = 2 * JUMP_V / GRAV;  // 점프 한 번의 체공 시간(초)

// ---------- 곡 목록 (전부 오리지널 멜로디, 빠른 일렉트로 스타일) ----------
// mel: 마디별 16분음표 16칸. 숫자 = 음계 음(7 = 한 옥타브 위), '-' = 앞 음 이어짐, '.' = 쉼
const SONGS = [
  { bpm: 160, root: 57, major: false, prog: [0, 5, 2, 6], mel: ["4-4-7-4-2-4-0-2-", "5-5-7-5-4-5-2-4-", "4-4-6-4-2-4-6-8-", "8-6-8-9-8-6-4-3-"] },   // 쉼 없이 달리는 8분음표 칩튠 훅
  { bpm: 142, root: 55, major: true,  prog: [0, 4, 5, 3], mel: ["0.2.4-.4.2.0.2-.", "4.6.8-.8.6.4.6-.", "5.7.9-.9.7.5.7-.", "7.5.3-.5.7.8.7-4"] },   // 통통 튀는 플럭
  { bpm: 175, root: 50, major: false, prog: [0, 0, 5, 6], mel: ["7.4.2.4.7.4.2.4.", "8.4.2.4.9.4.2.4.", "7.5.2.5.9.5.2.5.", "8.6.3.6.8-6-4-3-"] },
  { bpm: 130, root: 53, major: false, prog: [0, 6, 5, 4], half: true, mel: ["0-..0.3-..2.0...", "6-..6.8-..6.4...", "5-..5.7-..9.7...", "4-..6.8-6-4-2-1-"] },
  { bpm: 150, root: 53, major: true,  prog: [5, 3, 0, 4], mel: ["7-9-7-5-7---5-4-", "5-7-5-3-5---3-2-", "4-7-4-2-4---2-1-", "1-4-6-8-6---4-6-"] },
  { bpm: 170, root: 54, major: false, prog: [0, 2, 6, 5], mel: ["4.4.4-2.0.2.4-..", "6.6.6-4.2.4.6-..", "8.8.8-6.3.6.8-..", "9.7.5.7.9-8-7-4-"] },
];

// ---------- 레벨 빌더 (모든 맵은 오리지널 설계, 타일 좌표) ----------
function makeLevel(meta, build) {
  const L = Object.assign({ spikes: [], blocks: [], pads: [], orbs: [], saws: [], portals: [], gaps: [], ceil: [] }, meta);
  const api = {
    spike:     (x, y = 0) => L.spikes.push({ x, y, down: false }),
    hangSpike: (x, n = 0) => L.spikes.push({ x, y: 7 - n, down: true }),   // 천장에 매달린 스파이크
    mini:      x => L.spikes.push({ x, y: 0, down: false, small: true }),      // 낮은 미니 스파이크
    saw:       (x, y, r) => L.saws.push({ x, y, r }),                          // 회전 톱니 (중심 좌표·반지름, 타일 단위)
    block:     (x, y = 0) => L.blocks.push({ x, y }),
    column:    (x, h) => { for (let i = 0; i < h; i++) L.blocks.push({ x, y: i }); },
    hang:      (x, n) => { for (let i = 0; i < n; i++) L.blocks.push({ x, y: 7 - i }); },
    pad:       (x, y = 0) => L.pads.push({ x, y }),
    orb:       (x, y) => L.orbs.push({ x, y, used: false }),               // 점프 링 (중심 좌표, 공중에서 누르면 한 번 더 점프)
    gap:       (a, b) => L.gaps.push([a, b]),
    fly:  x => L.portals.push({ x, mode: "fly", color: "#4df0ff" }),
    roll: x => L.portals.push({ x, mode: "roll", color: "#8dff6a" }),
    flip: x => L.portals.push({ x, grav: -1, color: "#ff5ce1" }),
    norm: x => L.portals.push({ x, grav: 1, color: "#ffa64d" }),
    speed: (x, m) => L.portals.push({ x, speed: m, color: m > 1 ? "#ff5a4d" : m < 1 ? "#7aa8ff" : "#d8d8d8" }),   // 속도 포털
    setEnd: v => { L.end = v; },
  };
  build(api);
  L.portals.sort((a, b) => a.x - b.x);
  // 천장이 필요한 구간(비행/중력반전) 계산
  let fly = false, grav = 1, start = null;
  for (const p of L.portals) {
    if (p.mode) fly = p.mode === "fly";
    if (p.grav) grav = p.grav;
    const on = fly || grav === -1;
    if (on && start === null) start = p.x;
    if (!on && start !== null) { L.ceil.push([start, p.x]); start = null; }
  }
  if (start !== null) L.ceil.push([start, L.end]);
  // 충돌 검사를 빠르게 하기 위한 타일 x 인덱스
  L.blocksAt = []; L.spikesAt = [];
  for (const b of L.blocks) { if (!L.blocksAt[b.x]) L.blocksAt[b.x] = []; L.blocksAt[b.x].push(b); }
  for (const sp of L.spikes) { if (!L.spikesAt[sp.x]) L.spikesAt[sp.x] = []; L.spikesAt[sp.x].push(sp); }
  return L;
}

// ---------- 라운드 생성기: 난이도별 구간 조합, 장애물은 곡의 박자에 맞춰 배치 ----------

function mulberry(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

const DENSITY = 1.5;   // 장애물 밀도 배율 (간격을 줄이고 구간별 개수를 늘림)
function genLevel(r, seed, bpm) {
  const R = mulberry(seed * 7919 + r * 104729);
  const rnd = n => Math.floor(R() * n);
  const pick = arr => arr[rnd(arr.length)];
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
  // 큐브 속도: 1~20라운드 1.05 → 1.45, 21~30라운드 → 1.7, 31~50라운드는 완만하게 → 1.9
  const s = Math.round((r <= 20 ? 1.05 + 0.4 * (r - 1) / 19 : r <= 30 ? 1.45 + 0.25 * (r - 20) / 10 : 1.7 + 0.2 * (r - 30) / 20) * 100) / 100;
  const d = r <= 8 ? 1 : r <= 16 ? 2 : r <= 26 ? 3 : r <= 38 ? 4 : 5;   // 난이도 단계 (초반 라운드가 너무 가파르지 않도록 완만하게 조정)
  const target = Math.round((r <= 30 ? 380 + r * 15 : 830 + (r - 30) * 12) * 1.15 * 1.4);   // 길이: 약 640 ~ 1720 타일 (큐브가 1.4배 빨라진 만큼 늘려 플레이 시간 유지)
  let mul = 1;                                                        // 속도 포털로 바뀐 현재 속도 배율
  const cs = () => s * mul;
  const tps = m => BASE_SPEED * m / T;                                 // 배율 m 에서 초당 이동 타일 수
  // 장애물 사이 간격(초): 속도와 무관하게 '반응 시간'이 확보되도록 시간 기준으로 계산
  // 1라운드 1.35초 → 30라운드 1.0초로 서서히 줄고, 31라운드 이후는 1.15초
  const gapSec = (r <= 30 ? 1.35 - 0.35 * (r - 1) / 29 : 1.15) / DENSITY;
  const many = n => Math.round(n * DENSITY);                           // 특수 구간 안의 장애물 수도 같은 비율로 늘림
  const lead = () => Math.ceil(gapSec * tps(cs())) + rnd(3);
  // 박자 맞춤: 장애물이 음악의 박(beat)에 도착하도록 위치를 다음 박으로 민다 (속도 포털 구간도 시간으로 환산)
  const beatSec = 60 / bpm;
  let xRef = 0, tRef = 0;
  const setMul = (x, m) => { tRef += (x - xRef) / tps(cs()); xRef = x; mul = m; };
  const snap = x => Math.round(xRef + (Math.ceil((tRef + (x - xRef) / tps(cs())) / (beatSec / 2) - 1e-9) * (beatSec / 2) - tRef) * tps(cs()));   // 반 박 단위
  let prevC = null;                                                  // 비행 구간에서 직전 통로 중심 (행 단위)
  const used = new Set();

  // ----- 지상 구간 -----
  const ground = (a, x, kind) => {
    used.add(kind);
    switch (kind) {
      case "spike1": a.spike(x); return x + 1;
      case "spike2": a.spike(x); a.spike(x + 1); return x + 2;
      case "spike3": for (let i = 0; i < 3; i++) a.spike(x + i); return x + 3;
      case "spikeGap": a.spike(x); a.spike(x + 2); return x + 3;
      case "spikeGap3": a.spike(x); a.spike(x + 3); return x + 4;
      case "hurdle": { const h = 1 + rnd(2), w = 1 + rnd(2); for (let i = 0; i < w; i++) a.column(x + i, h); return x + w; }
      case "stairs2": for (let i = 0; i < 2; i++) { a.column(x + i, 1); a.column(x + 2 + i, 2); } return x + 4;
      case "stairs3": for (let i = 0; i < 2; i++) { a.column(x + i, 1); a.column(x + 2 + i, 2); a.column(x + 4 + i, 3); } return x + 6;
      case "stairs4": for (let i = 0; i < 3; i++) { a.column(x + i, 1); a.column(x + 3 + i, 2); a.column(x + 6 + i, 3); a.column(x + 9 + i, 4); } return x + 12;
      case "pyramid": for (let i = 0; i < 3; i++) { a.column(x + i, 1); a.column(x + 3 + i, 2); a.column(x + 6 + i, 3); a.column(x + 9 + i, 2); a.column(x + 12 + i, 1); } return x + 15;
      case "zigzagStep": { const n = 4 + rnd(2); for (let i = 0; i < n; i++) a.column(x + i, 1 + (i % 2)); return x + n; }
      case "wave": a.column(x, 1); a.column(x + 1, 2); a.column(x + 2, 2); a.column(x + 3, 1); return x + 4;
      case "chain": for (let i = 0; i < 4; i++) a.column(x + i, 1); a.spike(x + 3, 1); return x + 4;
      case "chain2": for (let i = 0; i < 8; i++) a.column(x + i, 1); a.spike(x + 3, 1); a.spike(x + 6, 1); return x + 8;
      case "gap3": a.gap(x, x + 3); return x + 3;
      case "gap4": a.gap(x, x + 4); return x + 4;
      case "gap5": a.gap(x, x + 5); return x + 5;
      case "doublegap": a.gap(x, x + 3); a.gap(x + 6, x + 9); return x + 9;
      case "padgap": a.pad(x); a.gap(x + 2, x + 7); return x + 7;
      case "padSpikes": a.pad(x); for (let i = 3; i <= 6; i++) a.spike(x + i); return x + 7;
      case "pillarhop": a.column(x, 2); a.spike(x + 3); a.column(x + 6, 2); return x + 7;
      case "underbridge": for (let i = 0; i < 5; i++) a.hang(x + i, 4); a.spike(x + 2); return x + 5;
      // 공중 발판: 계단에 올라 구덩이(용암/괴물) 위의 떠 있는 발판을 건너뜀 (폭·간격은 점프 거리에 비례)
      case "platforms": {
        const jl = AIR * tps(cs()), w = Math.max(3, Math.ceil(jl * 0.55)), g = Math.max(2, Math.round(jl * 0.3)), n = 2 + rnd(2);
        for (let i = 0; i < w; i++) a.column(x + i, 1);
        let e = x + w;
        for (let k = 0; k < n; k++) { for (let i = 0; i < w; i++) a.block(e + g + i, 1); e += g + w; }
        a.gap(x + w, e);
        return e;
      }
      // 점프 링: 한 번의 점프로는 못 넘는 긴 스파이크/구덩이 위에서 링을 눌러 2단 점프
      case "orbSpikes": case "orbPit": {
        const jl = AIR * tps(cs()), n = Math.ceil(jl * 1.45);
        if (kind === "orbPit") a.gap(x, x + n); else for (let i = 0; i < n; i++) a.spike(x + i);
        a.orb(x - 0.5 + jl * 0.75, 1.8);
        return x + n;
      }
      // 오르막 발판: 한 칸씩 높아지는 떠 있는 발판을 타고 올라갔다가 끝에서 뛰어내림
      case "stairsUp": {
        const jl = AIR * tps(cs()), w = Math.max(3, Math.ceil(jl * 0.55)), g = Math.max(2, Math.round(jl * 0.3)), n = 2 + rnd(2);
        for (let i = 0; i < w; i++) a.column(x + i, 1);
        let e = x + w;
        for (let k = 0; k < n; k++) { for (let i = 0; i < w; i++) a.block(e + g + i, k + 1); e += g + w; }
        a.gap(x + w, e);
        return e;
      }
      // 큰 계단: 한 단의 폭이 점프 거리에 비례하는 계단 (오르막 / 오르내림 / 패드로 꼭대기에 올라 내려오는 내리막)
      case "stepsUp": case "stepsUpDown": {
        const w = Math.max(3, Math.ceil(AIR * tps(cs()) * 0.75));
        const hts = kind === "stepsUp" ? [1, 2, 3, 4].slice(0, 3 + rnd(2)) : [1, 2, 3, 2, 1];
        hts.forEach((h, k) => { for (let i = 0; i < w; i++) a.column(x + k * w + i, h); });
        return x + hts.length * w;
      }
      case "stepsDown": {
        const t = tps(cs()), w = Math.max(3, Math.ceil(AIR * t * 0.75));
        let e = x + Math.ceil(0.761 * t) + Math.max(3, Math.ceil(t * 0.25));
        a.pad(x);
        for (let i = x + Math.ceil(0.3 * t); i < e; i++) a.column(i, 4);
        const sp = R() < 0.5;
        for (const h of [3, 2, 1]) { for (let i = 0; i < w; i++) a.column(e + i, h); if (h === 2 && sp) a.spike(e + w - 1, 2); e += w; }
        return e;
      }
      // 톱니: 바닥에 반쯤 박힌 회전 톱니 (하나 / 둘이 붙은 넓은 톱니)
      case "saw": a.saw(x + 1.1, 0, 1.1); return x + 3;
      case "sawWide": a.saw(x + 1.1, 0, 1.1); a.saw(x + 3.1, 0, 1.1); return x + 5;
      // 스파이크를 넘은 뒤 머리 위 톱니: 착지하자마자 또 뛰면 톱니에 닿음
      case "spikeSaw": {
        const jl = AIR * tps(cs());
        a.spike(x); a.spike(x + 1); a.saw(x + 2 + jl * 1.3, 3.2, 1.1);
        return Math.ceil(x + 4 + jl * 1.3);
      }
      // 미니 스파이크 밭: 낮은 스파이크가 길게 깔림
      case "miniSpikes": {
        const n = Math.max(3, Math.floor(AIR * tps(cs()) * 0.45));
        for (let i = 0; i < n; i++) a.mini(x + i);
        return x + n;
      }
      // 점프패드 탑: 패드로 높이 튀어 올라 4칸 높이 탑 위에 착지
      case "padTower": {
        const t = tps(cs()), st = x + Math.ceil(0.3 * t), en = x + Math.ceil(0.761 * t) + Math.max(3, Math.ceil(t * 0.25));
        a.pad(x);
        for (let i = st; i < en; i++) a.column(i, 4);
        return en;
      }
    }
  };
  // stairs3/stairs4/pyramid/pillarhop 처럼 좁은 발판에 정확히 착지해야 하는 장애물은
  // 속도가 아주 빨라지는 4~5단계에서는 물리적으로 클리어가 불가능해질 수 있어 3단계까지만 사용
  const pools = {
    1: ["spike1", "spike2", "spikeGap", "hurdle", "stairs2", "zigzagStep", "gap3", "wave", "chain", "platforms", "orbSpikes"],
    2: ["spike2", "spike3", "spikeGap", "hurdle", "stairs2", "stairs3", "zigzagStep", "wave", "chain", "gap3", "gap4", "padgap", "underbridge", "pillarhop", "platforms", "platforms", "orbSpikes", "orbPit"],
    3: ["spike3", "spikeGap", "spikeGap3", "stairs3", "stairs4", "pyramid", "zigzagStep", "wave", "chain", "chain2", "gap4", "gap5", "doublegap", "padgap", "padSpikes", "underbridge", "pillarhop", "platforms", "platforms", "orbSpikes", "orbPit"],
    4: ["spike3", "spikeGap3", "stairs2", "zigzagStep", "wave", "chain2", "chain2", "gap5", "doublegap", "padgap", "padSpikes", "underbridge", "platforms", "platforms", "orbSpikes", "orbPit"],
    5: ["spike3", "spikeGap3", "stairs2", "zigzagStep", "wave", "chain2", "chain2", "gap5", "doublegap", "padSpikes", "padSpikes", "underbridge", "padgap", "platforms", "platforms", "orbSpikes", "orbPit"],
  };
  for (const k in pools) {
    pools[k].push("platforms", "orbSpikes", k > 1 ? "orbPit" : "orbSpikes", "stairsUp", "stairsUp", "saw", "saw", "miniSpikes", "miniSpikes");   // 발판·링·톱니류가 자주 나오도록 비중을 높임
    pools[k].push("stepsUp", "stepsUp", "stepsUpDown", "stepsUpDown", "stepsDown", "stepsDown");   // 계단식 오르막·내리막
    if (k > 1) pools[k].push("sawWide", "spikeSaw", "spikeSaw", "padTower", "padTower");
  }
  // zone() 은 최고 속도(1.3배 포털 x 후반 라운드 가속)가 겹칠 수 있어 검증된 장애물만 사용
  const simple = ["spike1", "spike2", "spikeGap", "gap3", "gap4", "wave", "stairs2", "zigzagStep", "platforms", "orbSpikes", "saw", "miniSpikes"];

  // ----- 비행 구간: 바닥 또는 천장 중 한쪽에만 장애물 (위아래 동시에 막는 통로는 만들지 않음) -----
  const tunnel = (a, cx) => {
    if (R() < 0.3) { a.saw(cx + 1.1, 3 + rnd(3), 1.1); prevC = null; return cx + 3; }   // 공중에 뜬 톱니: 위나 아래로 피해 감
    const maxSum = [0, 3, 4, 5, 5, 5][d];
    let h = 0, n = 0, c = 0;
    for (let t = 0; t < 12; t++) {
      const type = pick(["floor", "ceil"]);
      h = type === "ceil" ? 0 : 1 + rnd(maxSum);
      n = type === "floor" ? 0 : 1 + rnd(maxSum);
      c = (h + 8 - n) / 2;
      if (prevC === null || Math.abs(c - prevC) <= (d >= 3 ? 3 : 2.6)) break;
    }
    prevC = c;
    const w = 1 + rnd(2);
    for (let k = 0; k < w; k++) {
      if (h === 1 && R() < 0.5) a.spike(cx + k); else if (h) a.column(cx + k, h);
      if (n === 1 && R() < 0.5) a.hangSpike(cx + k); else if (n) a.hang(cx + k, n);
    }
    return cx + w;
  };
  const fly = (a, x) => {
    a.fly(x); used.add("fly"); prevC = null;
    let cx = x + Math.ceil(0.6 * tps(s)) + rnd(3);
    const count = 2 + rnd(2) + (d >= 4 ? 1 : 0);   // 비행 구간은 짧게 (장애물 2~4개, 밀도 배율 미적용)
    for (let i = 0; i < count; i++) {
      cx = tunnel(a, cx);
      cx += Math.ceil(((r > 30 ? 1.0 : 0.95) + Math.max(0, 3 - d) * 0.08) * tps(Math.max(1, cs()))) + rnd(2);
    }
    a.roll(cx);
    return cx + Math.ceil(0.35 * tps(s));
  };

  // ----- 중력 반전 구간 (천장 주행) -----
  const flip = (a, x) => {
    a.flip(x); used.add("flip");
    let cx = x + Math.ceil(0.85 * tps(Math.max(1, cs())));
    const kinds = d === 1 ? ["hs1", "hs2", "hb1", "hpair"]
      : d === 2 ? ["hs1", "hs2", "hs3", "hb1", "hb2", "hpair", "hstair"]
      : ["hs2", "hs3", "hb2", "hpair", "hstair", "hchain", "hchain"];
    const count = many(3 + rnd(2) + Math.ceil(d / 2));
    for (let i = 0; i < count; i++) {
      const kind = pick(kinds);
      let w = 1;
      if (kind === "hs1" || kind === "hs2" || kind === "hs3") { w = +kind[2]; for (let j = 0; j < w; j++) a.hangSpike(cx + j); }
      else if (kind === "hpair") { a.hangSpike(cx); a.hangSpike(cx + 2); w = 3; }
      else if (kind === "hb1") { a.hang(cx, 1); if (R() < 0.5) { a.hang(cx + 1, 1); w = 2; } }
      else if (kind === "hb2") { a.hang(cx, 2); }
      else if (kind === "hstair") { a.hang(cx, 1); a.hang(cx + 1, 2); a.hang(cx + 2, 2); a.hang(cx + 3, 1); w = 4; }
      else if (kind === "hchain") { for (let j = 0; j < 4; j++) a.hang(cx + j, 1); a.hangSpike(cx + 3, 1); w = 4; }
      cx += w + lead();
    }
    a.norm(cx);
    return cx + Math.ceil(0.45 * tps(s));
  };

  // ----- 속도 구간: 빨간 포털(빨라짐) / 파란 포털(느려짐) -----
  const zone = (a, x) => {
    const fast = R() < 0.6, m = fast ? 1.3 : 0.8;
    a.speed(x, m); setMul(x, m); used.add(fast ? "fast" : "slow");
    let cx = x;
    const n = many(3 + rnd(2));
    for (let i = 0; i < n; i++) { cx = snap(cx + lead()); cx = ground(a, cx, pick(simple)); }
    cx += lead(); a.speed(cx, 1); setMul(cx, 1);
    return cx + Math.ceil(0.25 * tps(s));
  };

  const lv = makeLevel({ name: "", hue: 0, speed: s, end: 0 }, a => {
    // 특수 구간을 스테이지 전체에 고르게 배치 (연속으로 같은 종류는 피함)
    const allowed = ["fly"]; if (r >= 6) allowed.push("flip"); if (r >= 9) allowed.push("zone");
    const nSp = r < 3 ? 2 : 3 + Math.floor(r / 8);   // 비행 구간처럼 길게 이어지는 구간을 더 자주 배치
    const sp = []; let last = null;
    for (let i = 0; i < nSp; i++) {
      let t; do { t = pick(allowed); } while (t === last && allowed.length > 1);
      last = t; sp.push({ f: (i + 0.5) / nSp + (R() - 0.5) * 0.06, t });
    }
    const fns = { fly, flip, zone };
    let x = 16, since = 2;   // since: 직전 특수 구간 이후 놓인 지상 장애물 수 (특수 구간 사이에 최소 2개는 지상 장애물)
    while (x < target) {
      x = snap(x + lead());
      const frac = (x - 16) / (target - 16);
      if (sp.length && frac >= sp[0].f && since >= 2) { x = fns[sp.shift().t](a, x); since = 0; }
      else { x = ground(a, x, pick(pools[d])); since++; }
    }
    a.setEnd(x + 8);
  });
  const parts = [];
  if (used.has("fly")) parts.push("비행");
  if (used.has("flip")) parts.push("중력반전");
  if (used.has("fast") || used.has("slow")) parts.push("속도변화");
  if (lv.pads.length) parts.push("점프패드");
  if (lv.orbs.length) parts.push("점프링");
  if (lv.saws.length) parts.push("톱니");
  if (["stepsUp", "stepsUpDown", "stepsDown", "stairsUp"].some(k => used.has(k))) parts.push("계단");
  lv.kinds = used;
  lv.desc = parts.join(" · ") || "스파이크 · 블록";
  return lv;
}

const HUES = [215, 285, 130, 0, 190, 320, 45, 255, 165, 20];

// 봇 검증으로 확정한 라운드별 시드 (오프라인 검증: 전 라운드 클리어 가능)

// ---------- 사운드: WebAudio 로 직접 합성한 오리지널 BGM / 효과음 (외부 음원 없음) ----------
const Snd = (() => {
  let ac = null, master = null, musicGain = null, noiseBuf = null, timer = null;
  let muted = false, running = false, menuMode = false;
  let synth = null, duck = null, leadF = null, echo = null, padF = null, bassF = null;
  let step = 0, nextT = 0, t0 = 0, bpm = 140, song = SONGS[0], shift = 0, lastPad = 0;
  try { muted = localStorage.getItem("tiredash-mute") === "1"; } catch (e) {}
  const mtof = m => 440 * Math.pow(2, (m - 69) / 12);

  function init() {
    if (ac) { if (ac.state === "suspended") ac.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    ac = new AC();
    master = ac.createGain(); master.gain.value = muted ? 0 : 0.55;
    const comp = ac.createDynamicsCompressor();
    master.connect(comp); comp.connect(ac.destination);
    musicGain = ac.createGain(); musicGain.gain.value = 0.5; musicGain.connect(master);
    // 신스 버스: 킥이 칠 때마다 살짝 눌렸다 올라오는 사이드체인 펌핑
    duck = ac.createGain(); duck.connect(musicGain);
    synth = ac.createGain(); synth.connect(duck);
    leadF = ac.createBiquadFilter(); leadF.type = "lowpass"; leadF.frequency.value = 5200; leadF.connect(synth);
    // 리드에 박자 맞춘 에코(점8분음표 딜레이)를 걸어 공간감을 줌
    echo = ac.createDelay(1); const fb = ac.createGain(), wet = ac.createGain(); fb.gain.value = 0.38; wet.gain.value = 0.32;
    leadF.connect(echo); echo.connect(fb); fb.connect(echo); echo.connect(wet); wet.connect(synth);
    padF = ac.createBiquadFilter(); padF.type = "lowpass"; padF.frequency.value = 2400; padF.connect(synth);
    bassF = ac.createBiquadFilter(); bassF.type = "lowpass"; bassF.frequency.value = 700; bassF.Q.value = 4; bassF.connect(synth);
    noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    document.addEventListener("visibilitychange", () => { if (!ac) return; if (document.hidden) ac.suspend(); else ac.resume(); });
  }

  function osc(type, f, t, dur, vol, dest, slideTo) {
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(dest); o.start(t); o.stop(t + dur + 0.03);
  }
  function noise(t, dur, vol, dest, filterType, freq) {
    const n = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    n.buffer = noiseBuf; f.type = filterType; f.frequency.value = freq;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    n.connect(f); f.connect(g); g.connect(dest); n.start(t, Math.random() * 0.5); n.stop(t + dur + 0.03);
  }

  // 음이 끝까지 유지되는 신스 음색 (리드/패드용)
  function tone(type, f, t, dur, vol, dest, det) {
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t); if (det) o.detune.value = det;
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + 0.008);
    g.gain.setValueAtTime(vol, t + dur * 0.7); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(dest); o.start(t); o.stop(t + dur + 0.03);
  }

  const MAJ = [0, 2, 4, 5, 7, 9, 11], MIN = [0, 2, 3, 5, 7, 8, 10];
  const deg2m = d => song.root + shift + 12 * Math.floor(d / 7) + (song.major ? MAJ : MIN)[d % 7];
  function notesOf(bar) {   // 멜로디 문자열 → [시작 칸, 음, 길이]
    if (!song.notes) song.notes = song.mel.map(s => {
      const out = [];
      for (let i = 0; i < 16; i++) { const c = s[i]; if (c === "-") { if (out.length) out[out.length - 1][2]++; } else if (c !== ".") out.push([i, +c, 1]); }
      return out;
    });
    return song.notes[bar];
  }

  // 편곡: 8마디 단위로 A(기본) → B(아르페지오 추가) → 브레이크 4마디 후 재진입 → 풀 편성(아르페지오 + 화음)
  function schedule(st, t) {
    const sd = 60 / bpm / 4, b = Math.floor(st / 16), bar = b % 4, k = st % 16, sec = Math.floor(b / 8) % 4;
    const brk = !menuMode && sec === 2 && b % 8 < 4;
    const cd = song.prog[bar], tones = [cd, cd + 2, cd + 4].map(deg2m);
    if (menuMode) {
      if (k % 8 === 0) osc("sine", 140, t, 0.16, 0.5, musicGain, 45);
      if (k % 4 === 2) noise(t, 0.05, 0.1, musicGain, "highpass", 7500);
      if (k % 4 === 2) osc("sawtooth", mtof(tones[0] - 24), t, sd * 1.6, 0.2, bassF);
    } else if (!brk) {
      // 드럼: 4비트 킥 + 스네어 + 8분음표 하이햇(엇박은 오픈 하이햇)
      if (k % 4 === 0) {
        osc("sine", 170, t, 0.22, 1, musicGain, 40); noise(t, 0.012, 0.3, musicGain, "highpass", 3000);
        duck.gain.setValueAtTime(0.35, t); duck.gain.linearRampToValueAtTime(1, t + sd * 3.2);
      }
      if (song.half ? k === 8 : (k === 4 || k === 12)) { noise(t, 0.17, 0.5, musicGain, "bandpass", 1800); noise(t, 0.1, 0.2, musicGain, "highpass", 5000); osc("triangle", 230, t, 0.1, 0.3, musicGain, 130); }
      if (k % 4 === 2) noise(t, 0.1, 0.2, musicGain, "highpass", 7000);
      else if (k % 4 === 0 || sec % 2 === 1) noise(t, 0.03, 0.08, musicGain, "highpass", 9000);
      if (b % 8 === 7 && k >= 12) noise(t, 0.06, 0.15 + (k - 12) * 0.06, musicGain, "bandpass", 2600);   // 구간 끝 필인
      // 베이스: 정박은 낮은 음, 엇박은 한 옥타브 위로 튀는 8분음표 (하프타임 곡은 묵직한 당김음)
      if (song.half ? [0, 3, 6, 10, 12].includes(k) : k % 2 === 0) {
        const m = tones[0] - 24 + (!song.half && k % 4 === 2 ? 12 : 0);
        osc("sawtooth", mtof(m), t, sd * (song.half ? 2.8 : 1.9), 0.3, bassF); osc("square", mtof(m), t, sd * 1.5, 0.08, bassF);
      }
      // 코드: 마디 내내 깔리는 슈퍼소(디튠한 톱니파 겹침) 패드 — 킥에 맞춰 펌핑됨
      if (k === 0) for (const m of tones) { tone("sawtooth", mtof(m), t, sd * 16, 0.028, padF, -9); tone("sawtooth", mtof(m), t, sd * 16, 0.028, padF, 9); }
      // 칩튠 아르페지오: 두 옥타브를 오르내리는 16분음표
      if (sec % 2 === 1) osc("square", mtof([tones[0], tones[1], tones[2], tones[0] + 12, tones[1] + 12, tones[2] + 12, tones[1] + 12, tones[0] + 12][k % 8] + 12), t, sd * 0.9, 0.03, synth);
    } else {
      // 브레이크: 드럼이 빠지고 패드만, 마지막 마디에 스네어 롤로 고조
      if (k === 0) for (const m of tones) { tone("sawtooth", mtof(m), t, sd * 16, 0.03, padF, -9); tone("sawtooth", mtof(m), t, sd * 16, 0.03, padF, 9); }
      if (b % 8 === 3 && (k % 2 === 0 || k >= 8)) noise(t, 0.06, 0.08 + k * 0.025, musicGain, "bandpass", 2200 + k * 120);
    }
    // 리드 멜로디: 사각파 칩튠 음색 (마지막 구간에서는 3도 위 화음이 붙음)
    const vol = menuMode ? 0.09 : brk ? 0.08 : 0.1;
    for (const [ls, dg, len] of notesOf(bar)) if (ls === k) {
      const f = mtof(deg2m(dg) + 12), dur = sd * Math.max(len, 1.6);
      tone("square", f, t, dur, vol, leadF); tone("square", f, t, dur, vol * 0.6, leadF, 12); tone("sawtooth", f / 2, t, dur, vol * 0.35, leadF);
      if (sec === 3) tone("square", mtof(deg2m(dg + 2) + 12), t, dur, vol * 0.45, leadF);
    }
  }

  function pump() {
    if (!ac || !running) return;
    while (nextT < ac.currentTime + 0.14) { schedule(step, nextT); nextT += 60 / bpm / 4; step++; }
  }
  function begin() {
    if (!ac) return;
    running = true; step = 0; nextT = t0 = ac.currentTime + 0.06;
    musicGain.gain.cancelScheduledValues(ac.currentTime); musicGain.gain.setValueAtTime(menuMode ? 0.32 : 0.5, ac.currentTime);
    duck.gain.cancelScheduledValues(ac.currentTime); duck.gain.setValueAtTime(1, ac.currentTime);
    echo.delayTime.setValueAtTime(60 / bpm * 0.75, ac.currentTime);
    if (!timer) timer = setInterval(pump, 25);
  }
  const sfx = (fn) => { if (!ac || muted) return; fn(ac.currentTime, master); };

  return {
    init,
    get muted() { return muted; },
    toggle() {
      muted = !muted;
      try { localStorage.setItem("tiredash-mute", muted ? "1" : "0"); } catch (e) {}
      if (master) master.gain.setValueAtTime(muted ? 0 : 0.55, ac.currentTime);
    },
    setSong(i) { song = SONGS[i % SONGS.length]; bpm = song.bpm; shift = [0, 2, -2, 3, -3][Math.floor(i / SONGS.length) % 5]; menuMode = false; },   // 라운드마다 곡/조성이 달라짐
    restart() { if (ac) begin(); },
    menu() { if (!ac) return; song = SONGS[0]; bpm = 120; shift = 0; menuMode = true; begin(); },
    stopMusic() { running = false; },
    // 박자에 맞춰 1 → 0 으로 떨어지는 값 (화면 요소를 음악에 맞춰 번쩍이게 함)
    pulse() { if (!ac || !running) return 0; const ph = (ac.currentTime - t0) / (60 / bpm); return ph < 0 ? 0 : Math.max(0, 1 - (ph % 1) * 3); },
    isRunning: () => running,
    jump()   { sfx((t, d) => { osc("square", 330, t, 0.09, 0.14, d, 620); }); },
    pad()    { sfx((t, d) => { if (t - lastPad < 0.25) return; lastPad = t; osc("triangle", 380, t, 0.22, 0.25, d, 1500); osc("square", 760, t, 0.12, 0.06, d, 1800); }); },
    portal() { sfx((t, d) => { osc("sawtooth", 200, t, 0.35, 0.12, d, 900); osc("sine", 1200, t, 0.3, 0.12, d, 400); }); },
    click()  { sfx((t, d) => { osc("square", 700, t, 0.05, 0.1, d, 900); }); },
    death()  {
      sfx((t, d) => { noise(t, 0.35, 0.6, d, "lowpass", 2500); osc("square", 420, t, 0.4, 0.22, d, 45); osc("sawtooth", 120, t, 0.3, 0.2, d, 35); });
      if (ac) { musicGain.gain.cancelScheduledValues(ac.currentTime); musicGain.gain.setValueAtTime(0.07, ac.currentTime); }   // 죽으면 음악이 잠깐 죽음
    },
    win()    {
      running = false;
      sfx((t, d) => { [523, 659, 784, 1047, 1319].forEach((f, i) => { osc("square", f, t + i * 0.09, 0.28, 0.16, d); osc("triangle", f / 2, t + i * 0.09, 0.28, 0.14, d); }); });
    },
  };
})();

// ---------- 상태 ----------
const P = { x: 0, y: GROUND - S, vy: 0, grounded: true, mode: "roll", grav: 1, angle: 0, spd: 1 };
let LV = LEVELS[0], lvIdx = 0, sel = 0;
let state = "menu";     // menu | play | dead | win
let attempts = 1, deadTimer = 0, particles = [], holding = false;
let trail = [];   // 큐브 뒤에 남는 잔상(그림자) 기록
const TRAIL_LEN = 7;
const bests = LEVELS.map((_, i) => { try { return +localStorage.getItem("tiredash-best-" + i) || 0; } catch (e) { return 0; } });
let nextPortal = 0, shake = 0, tAnim = 0, deathHot = false;
const spd = () => BASE_SPEED * LV.speed * P.spd;

function saveBest(pct) {
  if (pct > bests[lvIdx]) { bests[lvIdx] = pct; try { localStorage.setItem("tiredash-best-" + lvIdx, pct); } catch (e) {} }
}

function reset() {
  P.x = 0; P.y = GROUND - S; P.vy = 0; P.grounded = true; P.mode = "roll"; P.grav = 1; P.angle = 0; P.spd = 1;
  for (const o of LV.orbs) o.used = false;
  nextPortal = 0; particles = []; trail = []; state = "play";
  Snd.restart();
}

function startLevel(i) {
  lvIdx = i; LV = LEVELS[i]; attempts = 1;
  Snd.setSong(i);
  reset();
}

function goMenu() { state = "menu"; sel = lvIdx; P.x = 0; P.y = GROUND - S; P.mode = "roll"; P.grav = 1; particles = []; Snd.menu(); }

function die() {
  if (state !== "play") return;
  state = "dead"; deadTimer = 0.75; shake = 0.25; Snd.death();
  deathHot = P.y + S > GROUND + 4;   // 구덩이에 빠져 죽으면 파편이 불꽃색
  saveBest(Math.min(99, Math.floor(P.x / (LV.end * T) * 100)));
  for (let i = 0; i < 26; i++) {
    const a = Math.random() * Math.PI * 2, v = 120 + Math.random() * 380;
    particles.push({ x: P.x + S / 2, y: P.y + S / 2, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 150, life: 0.7 + Math.random() * 0.4, r: 3 + Math.random() * 5 });
  }
}

// ---------- 입력 ----------
let COLS = 10, CARD_W = 81, CARD_H = 60, CARD_Y0 = 118, CARD_STEP = 68;
const cardRect = i => ({ x: 30 + (i % COLS) * (CARD_W + 10), y: CARD_Y0 + Math.floor(i / COLS) * CARD_STEP, w: CARD_W, h: CARD_H });
let MENU_BTN = { x: 20, y: 48, w: 64, h: 26 };
let MUTE_BTN = { x: W - 84, y: 68, w: 64, h: 26 };
// 세로 화면(폰/태블릿): 가로 폭은 720 으로 고정하고 세로를 화면 비율만큼 늘려서 위아래 공간을 채움
function layout() {
  if (typeof innerWidth === "undefined") return;
  const vw = innerWidth, vh = innerHeight;
  if (vh > vw * 1.1) {
    W = 720; H = Math.round(W * vh / vw); OY = Math.round((H - 540) / 2); PSX = 150; HUD = 26;
    COLS = 5; CARD_W = Math.floor((W - 60 - 40) / 5); CARD_H = 62; CARD_Y0 = 150 + HUD; CARD_STEP = 72;
    cv.style.width = vw + "px"; cv.style.height = vh + "px";
  } else {
    W = 960; H = 540; OY = 0; PSX = 200; HUD = 0;
    COLS = 10; CARD_W = 81; CARD_H = 60; CARD_Y0 = 118; CARD_STEP = 68;
    cv.style.width = ""; cv.style.height = "";
  }
  if (cv.width !== W) cv.width = W;
  if (cv.height !== H) cv.height = H;
  MENU_BTN = { x: 20, y: 48 + HUD, w: 64, h: 26 };
  MUTE_BTN = { x: W - 84, y: 68 + HUD, w: 64, h: 26 };
}
const inRect = (p, r) => p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h;
function toCanvas(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height };
}

function press(pos) {
  Snd.init();
  if (pos && inRect(pos, MUTE_BTN)) { Snd.toggle(); return; }
  if (state === "menu") {
    if (!Snd.isRunning()) Snd.menu();
    if (pos) { for (let i = 0; i < LEVELS.length; i++) if (inRect(pos, cardRect(i))) { startLevel(i); holding = true; } }
    else { startLevel(sel); holding = true; }
    return;
  }
  if (pos && inRect(pos, MENU_BTN)) { goMenu(); return; }
  holding = true;
  if (state === "win") { if (lvIdx + 1 < LEVELS.length) { startLevel(lvIdx + 1); holding = true; } else goMenu(); }
}
function release() { holding = false; }

addEventListener("keydown", e => {
  if (["Space", "ArrowUp", "KeyW", "Enter"].includes(e.code)) { e.preventDefault(); if (!e.repeat) press(); }
  else if (state === "menu" && e.code === "ArrowLeft") sel = (sel + LEVELS.length - 1) % LEVELS.length;
  else if (state === "menu" && e.code === "ArrowRight") sel = (sel + 1) % LEVELS.length;
  else if (state === "menu" && e.code === "ArrowDown") sel = Math.min(LEVELS.length - 1, sel + COLS);
  else if (state === "menu" && e.code === "ArrowUp") sel = Math.max(0, sel - COLS);
  else if (e.code === "KeyN") { Snd.init(); Snd.toggle(); }
  else if (e.code === "Escape" || e.code === "KeyM") goMenu();
});
addEventListener("keyup", e => { if (["Space", "ArrowUp", "KeyW", "Enter"].includes(e.code)) release(); });
// 캔버스 밖(빈 공간)을 눌러도 조작되도록 window 전체에서 터치/클릭을 받음
addEventListener("pointerdown", e => { e.preventDefault(); press(toCanvas(e)); });
addEventListener("pointerup", release);
addEventListener("pointercancel", release);
addEventListener("contextmenu", e => e.preventDefault());
addEventListener("resize", layout);
addEventListener("orientationchange", layout);
layout();

// ---------- 업데이트 ----------
const overlap = (ax, ay, aw, ah, bx, by, bw, bh) => ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
const PIT_D = 34;           // 구덩이 안의 용암·괴물까지의 깊이 (여기 닿으면 죽음)
const SAW_HIT = 0.85;       // 톱니 판정 반경 비율
const ORB_R = 0.7 * T;      // 점프 링 판정 반경 (보이는 것보다 넉넉함)
const inGap = () => LV.gaps.some(g => P.x >= g[0] * T && P.x + S <= g[1] * T);

function step(dt) {
  const prevTop = P.y, prevBottom = P.y + S;
  const dir = P.grav;
  P.x += spd() * dt;

  // 포탈
  while (nextPortal < LV.portals.length && P.x > LV.portals[nextPortal].x * T) {
    const pt = LV.portals[nextPortal++];
    if (pt.mode) P.mode = pt.mode;
    if (pt.grav) P.grav = pt.grav;
    if (pt.speed) P.spd = pt.speed; else { P.vy = 0; P.grounded = false; }
    Snd.portal();
  }

  if (P.mode === "roll") {
    if (holding && P.grounded) { P.vy = -JUMP_V * dir; Snd.jump(); }
    P.vy += GRAV * dir * dt;
    P.y += P.vy * dt;
    if (P.grounded) P.angle += (Math.round(P.angle / (Math.PI / 2)) * (Math.PI / 2) - P.angle) * Math.min(1, 25 * dt);
    else P.angle += dir * 5.8 * dt;
    P.grounded = false;
    if (dir === 1) {
      if (P.y + S >= GROUND && prevBottom <= GROUND + 2 && !inGap()) { P.y = GROUND - S; P.vy = 0; P.grounded = true; }
    } else if (P.y <= FLY_TOP) { P.y = FLY_TOP; P.vy = 0; P.grounded = true; }
  } else {
    P.vy += (holding ? -1900 : 1500) * K * dt;
    P.vy = Math.max(-420 * K, Math.min(420 * K, P.vy));
    P.y += P.vy * dt;
    if (P.y < FLY_TOP) { P.y = FLY_TOP; P.vy = 0; }
    if (P.y + S > GROUND) { P.y = GROUND - S; P.vy = 0; }
    P.angle = P.vy * 0.0009;
    P.grounded = false;
  }
  if (P.y + S > GROUND + PIT_D || P.y < -100) return die();

  const px = Math.floor(P.x / T);
  // 블록 (주변 타일만 검사)
  for (let tx = px - 2; tx <= px + 3; tx++) {
    const bl = LV.blocksAt[tx];
    if (!bl) continue;
    for (const b of bl) {
      const bx = b.x * T, by = GROUND - (b.y + 1) * T;
      if (!overlap(P.x, P.y, S, S, bx, by, T, T)) continue;
      if (P.mode === "roll" && dir === 1 && P.vy >= 0 && prevBottom <= by + 2) {
        P.y = by - S; P.vy = 0; P.grounded = true;
      } else if (P.mode === "roll" && dir === -1 && P.vy <= 0 && prevTop >= by + T - 2) {
        P.y = by + T; P.vy = 0; P.grounded = true;
      } else return die();
    }
  }
  // 스파이크
  for (let tx = px - 2; tx <= px + 3; tx++) {
    const sl = LV.spikesAt[tx];
    if (!sl) continue;
    for (const sp of sl) {
      const sx = sp.x * T, sy = GROUND - (sp.y + 1) * T;
      if (sp.small) { if (overlap(P.x, P.y, S, S, sx + 15 * K, sy + 27 * K, 10 * K, 13 * K)) return die(); continue; }
      if (overlap(P.x, P.y, S, S, sx + 13 * K, sp.down ? sy : sy + 16 * K, 14 * K, 24 * K)) return die();
    }
  }
  // 톱니 (원형 판정, 보이는 것보다 조금 작게)
  for (const w of LV.saws) {
    const cx = w.x * T, cy = GROUND - w.y * T, rr = w.r * T * SAW_HIT;
    if (cx + rr < P.x || cx - rr > P.x + S) continue;
    const nx = Math.max(P.x, Math.min(cx, P.x + S)), ny = Math.max(P.y, Math.min(cy, P.y + S));
    if ((nx - cx) * (nx - cx) + (ny - cy) * (ny - cy) < rr * rr) return die();
  }
  // 패드
  if (P.mode === "roll" && dir === 1) for (const d of LV.pads) {
    const dx = d.x * T, dy = GROUND - d.y * T - 10;
    if (overlap(P.x, P.y, S, S, dx + 4, dy, T - 8, 10)) { P.vy = -PAD_V; P.grounded = false; Snd.pad(); }
  }
  // 점프 링: 닿은 상태에서 누르고 있으면 공중에서 한 번 더 점프
  if (P.mode === "roll" && holding) for (const o of LV.orbs) {
    if (!o.used && overlap(P.x, P.y, S, S, o.x * T - ORB_R, GROUND - o.y * T - ORB_R, ORB_R * 2, ORB_R * 2)) { o.used = true; P.vy = -JUMP_V * dir; P.grounded = false; Snd.pad(); }
  }
  if (P.x > LV.end * T) { state = "win"; saveBest(100); Snd.win(); }
}

function update(dt) {
  tAnim += dt;
  if (shake > 0) shake -= dt;
  for (const p of particles) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 1200 * dt; p.life -= dt; }
  particles = particles.filter(p => p.life > 0);
  if (state === "play") {
    const h = 1 / 240;
    for (let i = 0; i < Math.round(dt / h); i++) { if (state === "play") step(h); }
  } else if (state === "dead") {
    deadTimer -= dt;
    if (deadTimer <= 0) { attempts++; reset(); }
  } else if (state === "menu") {
    LV = LEVELS[sel];
    P.x += 180 * dt;
    P.angle += 6 * dt;
  }
}

// ---------- 렌더링 ----------
const PAL = { ground: "#124", top: "#fff", block: "#06060c", edge: "#fff" };
const pal = () => PAL;
let beatPulse = 0;

function drawBackground(cam) {
  const gy = GROUND + OY;
  // 진행할수록 색상이 서서히 바뀜 (메뉴에서는 고정)
  const prog = state === "menu" ? 0 : Math.min(1, P.x / (LV.end * T));
  const h = (LV.hue + prog * 150) % 360;
  PAL.ground = `hsl(${h},80%,${26 + 5 * beatPulse}%)`;
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, `hsl(${h},85%,${46 + 6 * beatPulse}%)`); g.addColorStop(1, `hsl(${h},90%,20%)`);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // 사각형 모자이크: 큰 칸마다 크기·밝기가 다른 사각형을 겹쳐 그림 (느린 시차 스크롤)
  const C = 170, off = cam * 0.12, k0 = Math.floor(off / C);
  for (let k = k0; k * C - off < W; k++) for (let j = 0; j * C < H; j++) {
    const x = k * C - off, y = j * C, r = hs(k * 31 + j * 17), r2 = hs(k * 13 + j * 71);
    fr(x, y, C, C, `rgba(${r > 0.5 ? "255,255,255" : "0,0,0"},${0.03 + 0.07 * r2})`);
    const m = 14 + r * 40;
    fr(x + m, y + m, C - m * 2, C - m * 2, `rgba(255,255,255,${0.03 + 0.05 * r2})`);
    if (r2 > 0.6) { const q = C * 0.5; fr(x + r * (C - q), y + r2 * (C - q), q, q, "rgba(0,0,0,0.07)"); }
  }
  ctx.strokeStyle = "rgba(0,0,0,0.1)"; ctx.lineWidth = 2;
  for (let k = k0; k * C - off < W; k++) { ctx.beginPath(); ctx.moveTo(k * C - off, 0); ctx.lineTo(k * C - off, H); ctx.stroke(); }
  for (let j = 1; j * C < H; j++) { ctx.beginPath(); ctx.moveTo(0, j * C); ctx.lineTo(W, j * C); ctx.stroke(); }
  // 땅 아래(구덩이 안)는 어둡게
  fr(0, gy, W, H - gy, `hsl(${h},90%,9%)`);
}

// 구덩이 안: 넓은 구덩이는 끓는 용암, 좁은 구덩이는 용암 또는 입을 벌린 괴물 (떨어지면 끝)
function drawPit(x0, x1, key) {
  const w = x1 - x0, k = Math.round(key);
  ctx.save();
  ctx.beginPath(); ctx.rect(x0, GROUND - 90, w, H + 90); ctx.clip();
  if (w > 7 * T || hs(k) < 0.5) {
    // 용암: 위로 번지는 열기 + 출렁이는 표면 + 터지는 기포 + 튀어 오르는 불티
    let gr = ctx.createLinearGradient(0, GROUND - 90, 0, GROUND + 20);
    gr.addColorStop(0, "rgba(255,110,20,0)"); gr.addColorStop(1, "rgba(255,110,20,0.4)");
    ctx.fillStyle = gr; ctx.fillRect(x0, GROUND - 90, w, 110);
    gr = ctx.createLinearGradient(0, GROUND + 12, 0, GROUND + 130);
    gr.addColorStop(0, "#ffe066"); gr.addColorStop(0.25, "#ff7a1a"); gr.addColorStop(1, "#8a1200");
    ctx.fillStyle = gr; ctx.beginPath(); ctx.moveTo(x0, GROUND + H);
    for (let x = x0; x <= x1 + 8; x += 8) ctx.lineTo(x, GROUND + 20 + Math.sin((x + key) / 13 + tAnim * 3) * 4 + Math.sin((x + key) / 5 - tAnim * 2) * 1.5);
    ctx.lineTo(x1 + 8, GROUND + H); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = "#fff3a0"; ctx.lineWidth = 2; ctx.beginPath();
    for (let x = x0; x <= x1 + 8; x += 8) ctx.lineTo(x, GROUND + 20 + Math.sin((x + key) / 13 + tAnim * 3) * 4 + Math.sin((x + key) / 5 - tAnim * 2) * 1.5);
    ctx.stroke();
    const n = Math.max(2, Math.round(w / 40));
    for (let i = 0; i < n; i++) {
      const bx = x0 + 10 + hs(k * 7 + i) * (w - 20), ph = (tAnim * (0.5 + hs(k + i * 3) * 0.6) + hs(i + k)) % 1;
      ctx.globalAlpha = 1 - ph; ctx.strokeStyle = "#ffe066"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(bx, GROUND + 30 - ph * 8, 2 + ph * 6, 0, 7); ctx.stroke();
      const eh = (tAnim * (0.7 + hs(k * 3 + i) * 0.5) + hs(i * 5 + k)) % 1;   // 불티
      ctx.globalAlpha = 1 - eh; ctx.fillStyle = "#ffd447";
      ctx.fillRect(x0 + 6 + hs(k * 11 + i) * (w - 12) + Math.sin(tAnim * 4 + i) * 4, GROUND + 14 - eh * 80, 4, 4);
    }
    ctx.globalAlpha = 1;
  } else {
    // 괴물: 구덩이 속에서 입을 쩍 벌리고 기다림 (턱이 오르내리며 이빨이 딱딱거림)
    const bob = Math.sin(tAnim * 5 + k) * 5, top = GROUND + 22 + bob, cx = (x0 + x1) / 2;
    ctx.fillStyle = "#3d0f5c"; ctx.fillRect(x0, top, w, H);
    ctx.fillStyle = "#7a0a1e"; ctx.fillRect(x0 + 6, top, w - 12, 26);                      // 입속
    ctx.fillStyle = "#ff5c7a"; ctx.beginPath(); ctx.ellipse(cx, top + 26, w * 0.22, 9, 0, Math.PI, 0); ctx.fill();   // 혀
    ctx.fillStyle = "#fff";
    const tw = 14, tn = Math.max(2, Math.floor((w - 8) / tw)), tx0 = cx - tn * tw / 2;
    for (let i = 0; i < tn; i++) { ctx.beginPath(); ctx.moveTo(tx0 + i * tw, top + 4); ctx.lineTo(tx0 + i * tw + tw / 2, top - 15); ctx.lineTo(tx0 + (i + 1) * tw, top + 4); ctx.closePath(); ctx.fill(); }
    ctx.fillStyle = "#3d0f5c"; ctx.fillRect(x0, top + 26, w, H);                              // 아래턱·몸통
    const blink = (tAnim * 0.7 + hs(k + 3)) % 1 < 0.06 ? 0.15 : 1;
    for (const d of [-1, 1]) {
      const ex = cx + d * Math.min(w * 0.24, 44), ey = top + 46;
      ctx.shadowColor = "#ffe14d"; ctx.shadowBlur = 12; ctx.fillStyle = "#ffe14d";
      ctx.beginPath(); ctx.ellipse(ex, ey, 9, 9 * blink, 0, 0, 7); ctx.fill(); ctx.shadowBlur = 0;
      ctx.fillStyle = "#12000a"; ctx.beginPath(); ctx.ellipse(ex, ey, 2.5, 7 * blink, 0, 0, 7); ctx.fill();
    }
  }
  // 구덩이 벽 그림자
  ctx.fillStyle = "rgba(0,0,0,0.35)"; ctx.fillRect(x0, GROUND, 5, H); ctx.fillRect(x1 - 5, GROUND, 5, H);
  ctx.restore();
}

function drawGround(cam, noGaps) {
  const x0 = cam, x1 = cam + W / ZOOM;
  let cur = x0;
  const gaps = noGaps ? [] : LV.gaps.map(g => [g[0] * T, g[1] * T]).filter(g => g[1] > x0 && g[0] < x1).sort((a, b) => a[0] - b[0]);
  const segs = [];
  for (const g of gaps) { if (g[0] > cur) segs.push([cur, g[0]]); cur = Math.max(cur, g[1]); }
  if (cur < x1) segs.push([cur, x1]);
  for (const s of segs) {
    ctx.fillStyle = pal().ground;
    ctx.fillRect(s[0] - cam, GROUND, s[1] - s[0], H);
    ctx.fillStyle = "rgba(0,0,0,0.18)";
    ctx.fillRect(s[0] - cam, GROUND + 2 * T, s[1] - s[0], H);
    ctx.fillStyle = pal().top;
    ctx.fillRect(s[0] - cam, GROUND, s[1] - s[0], 3);
  }
  ctx.strokeStyle = "rgba(0,0,0,0.22)"; ctx.lineWidth = 2;   // 바닥 사각 타일 무늬 (2칸 크기)
  for (let x = -((cam % (2 * T)) + 2 * T) % (2 * T); x < W / ZOOM; x += 2 * T) { ctx.beginPath(); ctx.moveTo(x, GROUND + 3); ctx.lineTo(x, GROUND + 2 * T); ctx.stroke(); }
  for (const g of gaps) drawPit(g[0] - cam, g[1] - cam, g[0]);
}

function drawBlock(x, y) {
  ctx.fillStyle = pal().block;
  ctx.fillRect(x, y, T, T);
  ctx.strokeStyle = pal().edge; ctx.lineWidth = 2;
  ctx.strokeRect(x + 1, y + 1, T - 2, T - 2);
  ctx.globalAlpha = 0.18 + 0.22 * beatPulse; ctx.fillStyle = pal().edge;   // 박자에 맞춰 번쩍임
  ctx.fillRect(x + 8, y + 8, T - 16, T - 16); ctx.globalAlpha = 1;
}

function drawSaw(x, y, r) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(tAnim * 4);
  ctx.fillStyle = "#06060c"; ctx.strokeStyle = "#fff"; ctx.lineWidth = 2;
  ctx.beginPath();
  for (let i = 0; i < 20; i++) { const a = i * Math.PI / 10, rr = i % 2 ? r * 0.78 : r; ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); }
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.arc(0, 0, r * 0.4, 0, 7); ctx.stroke();
  ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(0, 0, r * 0.12, 0, 7); ctx.fill();
  ctx.restore();
}

function drawSpike(x, y, down, small) {
  ctx.fillStyle = "#06060c";
  ctx.strokeStyle = "#fff"; ctx.lineWidth = 2;
  ctx.beginPath();
  if (small) { ctx.moveTo(x + 8, y + T); ctx.lineTo(x + T / 2, y + T * 0.55); ctx.lineTo(x + T - 8, y + T); }
  else if (down) { ctx.moveTo(x + 3, y); ctx.lineTo(x + T / 2, y + T - 4); ctx.lineTo(x + T - 3, y); }
  else { ctx.moveTo(x + 3, y + T); ctx.lineTo(x + T / 2, y + 4); ctx.lineTo(x + T - 3, y + T); }
  ctx.closePath(); ctx.fill(); ctx.stroke();
}

const CUBE_H = 21;          // 큐브 한 변의 절반 (화면 크기 42px, 충돌 판정 S=30은 그대로라 조금 더 관대함)
function drawCube(cx, cy, angle, wings) {
  ctx.save(); ctx.translate(cx, cy);
  if (wings) {
    ctx.fillStyle = "#fff2b0"; ctx.strokeStyle = "#3a2600"; ctx.lineWidth = 2;
    const flap = Math.sin(tAnim * 18) * 5;
    ctx.beginPath(); ctx.moveTo(-10, -6); ctx.lineTo(-40, -24 + flap); ctx.lineTo(-32, 2); ctx.lineTo(-10, 8); ctx.closePath(); ctx.fill(); ctx.stroke();
  }
  ctx.rotate(angle);
  const h = CUBE_H;
  const g = ctx.createLinearGradient(-h, -h, h, h);
  g.addColorStop(0, "#fff3a0"); g.addColorStop(0.45, "#ffc928"); g.addColorStop(1, "#e08a00");
  ctx.shadowColor = "#ffd84a"; ctx.shadowBlur = 12;
  ctx.fillStyle = g; ctx.fillRect(-h, -h, h * 2, h * 2); ctx.shadowBlur = 0;
  ctx.strokeStyle = "#3a2600"; ctx.lineWidth = 3; ctx.strokeRect(-h, -h, h * 2, h * 2);
  ctx.strokeStyle = "rgba(255,255,255,0.55)"; ctx.lineWidth = 2; ctx.strokeRect(-h + 4, -h + 4, h * 2 - 8, h * 2 - 8);
  // 얼굴: 네모 눈 두 개와 입
  ctx.fillStyle = "#3a2600";
  ctx.fillRect(-12, -11, 9, 9); ctx.fillRect(3, -11, 9, 9); ctx.fillRect(-12, 5, 24, 6);
  ctx.fillStyle = "#7df9ff"; ctx.fillRect(-10, -9, 5, 5); ctx.fillRect(5, -9, 5, 5);
  ctx.restore();
}

// 큐브 뒤에 남기는 잔상 (실루엣만, 뒤로 갈수록 흐려지고 작아짐)
function drawCubeGhost(cx, cy, angle, alpha, scale) {
  ctx.save(); ctx.globalAlpha = alpha; ctx.translate(cx, cy); ctx.rotate(angle); ctx.scale(scale, scale);
  ctx.fillStyle = "#ffe58a"; ctx.fillRect(-CUBE_H, -CUBE_H, CUBE_H * 2, CUBE_H * 2);
  ctx.restore();
}

function text(s, x, y, size, color = "#fff", align = "center") {
  ctx.font = `bold ${size}px "Malgun Gothic", sans-serif`;
  ctx.textAlign = align; ctx.fillStyle = "rgba(0,0,0,0.5)"; ctx.fillText(s, x + 2, y + 2);
  ctx.fillStyle = color; ctx.fillText(s, x, y);
}

function drawWorld(cam) {
  for (const r of LV.ceil) {
    const x0 = r[0] * T - cam, x1 = r[1] * T - cam;
    if (x1 < 0 || x0 > W / ZOOM) continue;
    ctx.fillStyle = pal().ground;
    ctx.fillRect(x0, -H, x1 - x0, FLY_TOP + H);
    ctx.fillStyle = pal().top;
    ctx.fillRect(x0, FLY_TOP - 3, x1 - x0, 3);
  }
  for (const w of LV.saws) if ((w.x + w.r) * T - cam > 0 && (w.x - w.r) * T - cam < W / ZOOM) drawSaw(w.x * T - cam, GROUND - w.y * T, w.r * T);   // 바닥 톱니는 아래쪽 절반이 땅에 가려짐
  drawGround(cam);
  const inView = x => x * T - cam > -T && x * T - cam < W / ZOOM;
  for (const b of LV.blocks) if (inView(b.x)) drawBlock(b.x * T - cam, GROUND - (b.y + 1) * T);
  for (const s of LV.spikes) if (inView(s.x)) drawSpike(s.x * T - cam, GROUND - (s.y + 1) * T, s.down, s.small);
  for (const d of LV.pads) if (inView(d.x)) {
    ctx.fillStyle = "#ffd447"; ctx.fillRect(d.x * T - cam + 4, GROUND - d.y * T - 8, T - 8, 8);
    ctx.fillStyle = "rgba(255,212,71,0.35)"; ctx.fillRect(d.x * T - cam + 8, GROUND - d.y * T - 14, T - 16, 6);
  }
  for (const o of LV.orbs) if (inView(o.x)) {
    const ox = o.x * T - cam, oy = GROUND - o.y * T, rr = T * (0.3 + 0.06 * beatPulse);
    ctx.globalAlpha = o.used ? 0.3 : 1;
    ctx.strokeStyle = "#ffd447"; ctx.lineWidth = 3; ctx.shadowColor = "#ffd447"; ctx.shadowBlur = 14;
    ctx.beginPath(); ctx.arc(ox, oy, rr + 9, 0, 7); ctx.stroke(); ctx.shadowBlur = 0;
    ctx.fillStyle = "#ffe98a"; ctx.beginPath(); ctx.arc(ox, oy, rr, 0, 7); ctx.fill();
    ctx.globalAlpha = 1;
  }
  for (const p of LV.portals) if (inView(p.x)) {
    const x = p.x * T - cam;
    ctx.strokeStyle = p.color; ctx.lineWidth = 5; ctx.shadowColor = p.color; ctx.shadowBlur = 16;
    ctx.beginPath(); ctx.ellipse(x, GROUND - 4 * T, 14, 2 * T, 0, 0, 7); ctx.stroke(); ctx.shadowBlur = 0;
  }
  const ex = LV.end * T - cam;
  if (ex > -50 && ex < W / ZOOM) for (let i = 0; i < 12; i++) { ctx.fillStyle = i % 2 ? "#fff" : "#111"; ctx.fillRect(ex, GROUND - (i + 1) * 40, 20, 40); }
}

function draw() {
  const px0 = PSX / ZOOM, cam = P.x - px0;   // 확대 후에도 큐브가 화면 PSX 위치에 오도록
  ctx.save();
  if (shake > 0) ctx.translate((Math.random() - 0.5) * 10, (Math.random() - 0.5) * 10);
  beatPulse = Snd.pulse();
  drawBackground(cam);
  // 세로 화면에서는 플레이 영역을 가운데로, 바닥선을 기준으로 확대
  ctx.translate(0, OY + GROUND * (1 - ZOOM)); ctx.scale(ZOOM, ZOOM);
  if (state === "menu") drawGround(cam, true); else drawWorld(cam);

  if (state !== "dead") {
    // 큰 큐브가 바닥/천장 위에 정확히 얹혀 보이도록 위치 보정 (비행 중에는 중앙)
    const ty = P.mode === "fly" ? P.y + S / 2 : P.grav === 1 ? P.y + S - CUBE_H : P.y + CUBE_H;
    if (state === "play") {
      trail.push({ y: ty, angle: P.angle });
      if (trail.length > TRAIL_LEN) trail.shift();
      for (let i = 0; i < trail.length - 1; i++) {
        const age = trail.length - 1 - i, t = age / TRAIL_LEN;
        drawCubeGhost(px0 + S / 2 - age * 8, trail[i].y, trail[i].angle, 0.32 * (1 - t), 1 - t * 0.35);
      }
    }
    drawCube(px0 + S / 2, ty, P.angle, P.mode === "fly");
  }
  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillStyle = deathHot ? "#ff7a1a" : "#ffd447";
    ctx.fillRect(p.x - cam - p.r, p.y - p.r, p.r * 2, p.r * 2);
  }
  ctx.globalAlpha = 1;
  ctx.restore();
  if (state === "menu") drawMenu(); else drawHUD();
}

function drawHUD() {
  const pct = Math.min(100, P.x / (LV.end * T) * 100);
  const BW = W < 900 ? 300 : 400;
  ctx.save(); ctx.translate(0, HUD);
  ctx.fillStyle = "rgba(0,0,0,0.45)"; ctx.fillRect(W / 2 - BW / 2, 18, BW, 12);
  ctx.fillStyle = "#8dff6a"; ctx.fillRect(W / 2 - BW / 2, 18, BW * pct / 100, 12);
  text(Math.floor(pct) + "%", W / 2 + BW / 2 + 32, 32, 18);
  text((lvIdx + 1) + ". " + LV.name, 20, 34, 18, "#fff", "left");
  text("시도 " + attempts, W - 20, 34, 18, "#fff", "right");
  text("최고 " + bests[lvIdx] + "%", W - 20, 58, 16, "#ffd447", "right");
  ctx.restore();
  ctx.fillStyle = "rgba(0,0,0,0.45)"; ctx.fillRect(MENU_BTN.x, MENU_BTN.y, MENU_BTN.w, MENU_BTN.h);
  text("메뉴", MENU_BTN.x + MENU_BTN.w / 2, MENU_BTN.y + 19, 15);
  drawMute();

  if (state === "win") {
    const cy = H / 2 - 40;
    ctx.fillStyle = "rgba(0,0,0,0.55)"; ctx.fillRect(0, 0, W, H);
    text("클리어!", W / 2, cy, 72, "#8dff6a");
    text("시도 횟수: " + attempts, W / 2, cy + 60, 26);
    text(lvIdx + 1 < LEVELS.length ? "화면을 터치 / 스페이스: 다음 라운드로" : "모든 라운드 클리어! 터치하면 메뉴로", W / 2, cy + 110, 20, "#cfd6ff");
    text("메뉴 버튼으로 라운드 선택", W / 2, cy + 142, 16, "#cfd6ff");
  }
}

function drawMute() {
  ctx.fillStyle = "rgba(0,0,0,0.45)"; ctx.fillRect(MUTE_BTN.x, MUTE_BTN.y, MUTE_BTN.w, MUTE_BTN.h);
  text(Snd.muted ? "소리 끔" : "소리 켬", MUTE_BTN.x + MUTE_BTN.w / 2, MUTE_BTN.y + 19, 14, Snd.muted ? "#ff8a8a" : "#fff");
}

function drawMenu() {
  ctx.fillStyle = "rgba(0,0,0,0.55)"; ctx.fillRect(0, 0, W, H);
  drawMute();
  text("Cube Dash", W / 2, 66 + HUD, 50, "#ffd447");
  text("라운드를 골라 시작하세요 (총 " + LEVELS.length + "라운드)", W / 2, 100 + HUD, 18, "#cfd6ff");
  LEVELS.forEach((lv, i) => {
    const r = cardRect(i), on = i === sel;
    ctx.fillStyle = on ? `hsla(${lv.hue},60%,32%,0.97)` : `hsla(${lv.hue},40%,16%,0.88)`;
    ctx.fillRect(r.x, r.y, r.w, r.h);
    ctx.strokeStyle = `hsl(${lv.hue},80%,65%)`; ctx.lineWidth = on ? 4 : 2;
    ctx.strokeRect(r.x, r.y, r.w, r.h);
    const cp = r.w < 100;   // 카드가 작을 때(가로 10열)는 작은 글씨로
    text(String(i + 1), r.x + (cp ? 22 : 28), r.y + (cp ? 38 : 40), cp ? 24 : 28, `hsl(${lv.hue},90%,78%)`);
    text("★".repeat(lv.stars), r.x + r.w - (cp ? 6 : 12), r.y + (cp ? 14 : 22), cp ? 10 : 13, "#ffd447", "right");
    text(bests[i] >= 100 ? "CLEAR" : bests[i] + "%", r.x + r.w - (cp ? 6 : 12), r.y + r.h - (cp ? 8 : 14), cp ? 12 : 16, bests[i] >= 100 ? "#8dff6a" : "#fff", "right");
  });
  const cur = LEVELS[sel];
  text((sel + 1) + ". " + cur.name + "  —  " + cur.desc, W / 2, H - 40, 20, "#fff");
  text(W < 900 ? "터치: 점프(화면 어디든) · 노란 링: 공중에서 터치하면 2단 점프 · 파란 포탈 비행" : "클릭/터치 또는 방향키 + 스페이스 · N: 소리 · 누르고 있으면 점프 · 노란 링: 공중에서 누르면 2단 점프 · 파란 포탈 비행 · 분홍 포탈 중력 반전 · 빨강/하늘 포탈 속도 변화", W / 2, H - 14, W < 900 ? 15 : 13, "#cfd6ff");
}

// ---------- 메인 루프 ----------
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt); draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
